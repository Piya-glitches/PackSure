version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: packsure
      POSTGRES_PASSWORD: packsure
      POSTGRES_DB: packsure
    ports:
      - "5432:5432"
    volumes:
      - packsure_pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://packsure:packsure@db:5432/packsure
      JWT_SECRET: local-dev-secret-change-in-production
      CORS_ORIGINS: http://localhost:5173
      PRELOAD_MODELS: "true"
      # Ollama running on the HOST (or point this at your Colab tunnel URL).
      ENABLE_VLM: "true"
      OLLAMA_URL: http://host.docker.internal:11434
      VLM_MODEL_NAME: qwen2.5vl:3b
      ENABLE_LINE_CLASSIFIER: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # needed on Linux; harmless on Docker Desktop
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend/models:/app/models          # pdp_yolov8n_seg.onnx / .pt go here
      # PaddleOCR downloads its det/rec/cls weights here on first start;
      # persist them so recreating the container doesn't re-download.
      - paddleocr_cache:/root/.paddleocr
      - hf_cache:/root/.cache/huggingface

volumes:
  packsure_pg_data:
  paddleocr_cache:
  hf_cache:
